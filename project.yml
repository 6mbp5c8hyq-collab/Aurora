name: AURORA
options:
  bundleIdPrefix: com.auroraindustrial
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
targets:
  AURORA:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AURORA
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.auroraindustrial.native
        PRODUCT_NAME: AURORA
        INFOPLIST_FILE: AURORA/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - sdk: Charts.framework
      - sdk: QuickLook.framework
      - sdk: PDFKit.framework
