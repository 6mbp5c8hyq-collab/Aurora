name: Input Governance Contract
on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: aurora-input-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governed-input-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AURORA_BACKEND: https://todo-app-production-afcc.up.railway.app
    steps:
      - uses: actions/checkout@v4

      - name: Verify governed input source contract
        run: |
          set -euo pipefail
          test -s AURORA/GovernedInputWorkflowView.swift
          test -s AURORA/InputWorkflowView.swift
          test -s AURORA/Core.swift
          grep -q 'GovernedInputWorkflowView()' AURORA/InputWorkflowView.swift
          grep -q 'measured_requires_nonempty_source_reference' AURORA/GovernedInputWorkflowView.swift
          grep -q 'measured_claim_source_missing' AURORA/GovernedInputWorkflowView.swift
          grep -q 'server_parsed_input_not_automatically_measured' AURORA/GovernedInputWorkflowView.swift
          grep -q 'user_declared_design_basis' AURORA/GovernedInputWorkflowView.swift
          grep -q 'design_intent_not_as_built' AURORA/GovernedInputWorkflowView.swift
          grep -q 'SEMANTIC RELEVANCE ONLY' AURORA/GovernedInputWorkflowView.swift
          grep -q 'NO COMPLETENESS SCORE' AURORA/GovernedInputWorkflowView.swift
          grep -q 'var canonicalProject: JSONValue' AURORA/Core.swift
          grep -q 'var canonicalDesignBasis: JSONValue' AURORA/Core.swift
          grep -q 'var canonicalAnalyses: JSONValue' AURORA/Core.swift
          grep -q '"feedTph": .number(feedTPH)' AURORA/Core.swift
          grep -q '"project": canonicalProject' AURORA/Core.swift
          grep -q '"designBasis": canonicalDesignBasis' AURORA/Core.swift
          grep -q '"analyses": canonicalAnalyses' AURORA/Core.swift

      - name: Verify production preflight accepts canonical governed payload
        run: |
          set -euo pipefail
          cat > governed-input.json <<'JSON'
          {
            "payload": {
              "project": {
                "id": "11111111-2222-3333-4444-555555555555",
                "name": "CI Governed Input",
                "oreType": "phosphate",
                "feedTph": 80.0
              },
              "designBasis": {
                "targetComponent": "P2O5",
                "targetGrade": 35.0,
                "authority": "user_declared_design_basis"
              },
              "analyses": [
                {
                  "type": "XRF",
                  "parameter": "P2O5",
                  "value": 20.1,
                  "unit": "%",
                  "status": "MEASURED",
                  "source": "CI-LAB-001",
                  "sample": "FEED",
                  "authority_requested": "measured",
                  "authority_effective": "measured_source_tagged"
                },
                {
                  "type": "PSD",
                  "parameter": "P80",
                  "value": 250.0,
                  "unit": "µm",
                  "status": "ESTIMATED",
                  "source": "mobile_quick_assay",
                  "sample": "FEED",
                  "authority_requested": "estimated",
                  "authority_effective": "estimated"
                }
              ],
              "flowsheet": {
                "units": ["ROM Feed", "Scrubbing", "Desliming", "Flotation", "Product", "Tailings"],
                "authority": "user_declared_process_route",
                "topology_status": "design_intent_not_as_built"
              },
              "inputGovernance": {
                "runtime_projection": "canonical_analysis_array",
                "measured_rule": "measured_requires_nonempty_source_reference"
              }
            }
          }
          JSON

          status=$(curl --silent --show-error --retry 3 --retry-delay 2 \
            --output preflight.json \
            --write-out '%{http_code}' \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data-binary @governed-input.json \
            "$AURORA_BACKEND/api/validate")
          echo "HTTP status=$status"
          cat preflight.json
          test "$status" = "200"
          jq -e '.ok == true and .status == "input_valid" and .feed_tph == 80 and (.unit_count | tonumber) >= 1' preflight.json
          jq -e '.target.value == 35 or .target.value == 35.0' preflight.json
