name: Process Balance Contract
on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: aurora-process-balance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stream-balance-export:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AURORA_BACKEND: https://todo-app-production-afcc.up.railway.app
    steps:
      - name: Verify governed stream and balance export
        run: |
          set -euo pipefail
          cat > payload.json <<'JSON'
          {
            "format": "csv",
            "filename": "AURORA_CI_Stream_Balance",
            "project": {"name": "CI stream balance contract"},
            "designBasis": {
              "export_scope": "recognized_returned_stream_and_balance_objects",
              "authority": "active_result_returned_values_only",
              "closure_rule": "explicit_status_text_only",
              "field_evidence_rule": "lexical_ui_classification_only",
              "stream_count": 1,
              "balance_count": 1
            },
            "analyses": [],
            "flowsheet": {},
            "diagnostics": [],
            "result": {
              "streams": [{
                "id": "streams.feed",
                "name": "Feed",
                "fields": [
                  {"path": "streams.feed.mass_flow_tph", "name": "mass_flow_tph", "value": "10", "evidence_class": "unqualified_returned"}
                ]
              }],
              "balances": [{
                "id": "mass_balance",
                "explicit_status": "closed",
                "closure_class": "Explicit closed/pass",
                "fields": [
                  {"path": "mass_balance.residual_tph", "name": "residual_tph", "value": "0.01", "evidence_class": "unqualified_returned"}
                ]
              }]
            },
            "run": {"id": null, "origin": "ci_contract", "status": "contract_test", "scope": "stream_balance_workspace"}
          }
          JSON

          status=$(curl --silent --show-error --retry 3 --retry-delay 2 \
            --output stream-balance.csv \
            --write-out '%{http_code}' \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data-binary @payload.json \
            "$AURORA_BACKEND/api/exports")
          test "$status" = "200"
          test -s stream-balance.csv
          bytes=$(wc -c < stream-balance.csv)
          test "$bytes" -gt 20
          echo "stream balance CSV bytes=$bytes"
