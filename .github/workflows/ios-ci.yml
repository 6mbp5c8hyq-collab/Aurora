name: iOS Native CI
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  simulator-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build native iOS app
        run: |
          set -o pipefail
          xcodebuild -project AURORA.xcodeproj -scheme AURORA -configuration Debug -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 16 Pro' CODE_SIGNING_ALLOWED=NO build
