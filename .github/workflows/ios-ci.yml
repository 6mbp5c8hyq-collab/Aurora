name: iOS Native CI
on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: aurora-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AURORA_BACKEND: https://todo-app-production-afcc.up.railway.app
    steps:
      - name: Verify health contract
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            "$AURORA_BACKEND/api/health" -o health.json
          jq -e '
            (.canonical_entrypoint | type == "string") and
            (.dependency_gate != null) and
            ((.status // .platform_status // .state // "") | type == "string")
          ' health.json

      - name: Verify optimized runtime and telemetry contract
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            "$AURORA_BACKEND/api/telemetry/recent" -o telemetry.json
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            "$AURORA_BACKEND/api/perf/probe" -o performance.json
          jq -e '
            (.ok == true) and
            (.optimized_entrypoint == true) and
            (.ui_revision | type == "string") and
            (.export_queue | type == "object") and
            (.export_queue.queued | type == "number") and
            (.export_queue.working | type == "number") and
            (.export_queue.ready | type == "number") and
            (.export_queue.failed | type == "number")
          ' telemetry.json
          jq -e '
            (.ok == true) and
            (.optimized_entrypoint == true) and
            (.revision | type == "string") and
            (.jobs_ms | type == "number") and
            (.dag_cold_ms | type == "number") and
            (.dag_warm_ms | type == "number") and
            (.backend | type == "string")
          ' performance.json

      - name: Verify fast audit routing contract
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            "$AURORA_BACKEND/api/audit" -o audit-summary.json
          jq -e '
            (.ok == true) and
            (.audit_status | type == "string") and
            (.runtime.source_integrity_ready == true) and
            (.runtime.scientific_runtime_ready == true) and
            (.deep_audit_url == "/api/audit/deep")
          ' audit-summary.json

      - name: Verify deep runtime audit contract
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --retry-delay 2 --max-time 300 \
            "$AURORA_BACKEND/api/audit/deep" -o audit.json
          echo "AURORA deep audit contract snapshot:"
          jq '{
            ok,
            audit_status,
            canonical_entrypoint,
            runtime: {
              source_integrity_ready: .runtime.source_integrity_ready,
              scientific_runtime_ready: .runtime.scientific_runtime_ready,
              direct_dependency_runtime_ready: .runtime.direct_dependency_runtime_ready,
              payload_member_count: .runtime.payload_member_count,
              python_module_count: .runtime.python_module_count
            },
            engines: {
              declared_count: .engines.declared_count,
              declared_type: (.engines.declared | type),
              observed_count: ((.engines.observed_in_completed_jobs // []) | length),
              execution_state: .engines.execution_state
            },
            dag: {
              declared_count: .dag.declared_count,
              declared_type: (.dag.declared | type),
              execution_state: .dag.execution_state
            },
            dependency_gate_present: (.dependency_gate != null)
          }' audit.json
          jq -e '
            (.ok == true) and
            (.canonical_entrypoint | type == "string") and
            (.dependency_gate != null) and
            (.engines.declared_count >= 1) and
            (.engines.declared | type == "array") and
            (.dag.declared_count >= 1) and
            (.dag.declared | type == "array") and
            (.runtime.source_integrity_ready == true) and
            (.runtime.scientific_runtime_ready == true)
          ' audit.json

      - name: Verify platform data and model catalog contract
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            "$AURORA_BACKEND/api/platform/capabilities" -o platform-capabilities.json
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            "$AURORA_BACKEND/api/platform/databases" -o platform-databases.json
          jq -e '
            (.ok == true) and
            (.revision | type == "string") and
            (.engine_count >= 1) and
            (.engines | type == "array") and
            (.asset_count >= 1) and
            (.readable_asset_count >= 1) and
            (.categories | type == "object") and
            (.governance | type == "object")
          ' platform-capabilities.json
          jq -e '
            (.ok == true) and
            (.count >= 1) and
            (.assets | type == "array") and
            (.asset_count >= .count) and
            (.categories | type == "object") and
            (.formats | type == "object") and
            (.governance | type == "object")
          ' platform-databases.json

      - name: Verify runtime component registry authority boundary
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 300 \
            "$AURORA_BACKEND/api/platform/components?limit=8000" -o platform-components.json
          jq -e '
            (.ok == true) and
            (.revision | type == "string") and
            (.execution_engine_count >= 1) and
            (.execution_engines | type == "array") and
            (.component_count >= 1) and
            (.components | type == "array") and
            (.role_counts | type == "object") and
            (.syntax_counts | type == "object") and
            (.governance | type == "object") and
            (all(.components[]?; .execution_authority == false)) and
            (all(.execution_engines[]?; .authority == "registered_execution_engine"))
          ' platform-components.json
          engine=$(jq -r '.execution_engines[0].id' platform-components.json)
          test -n "$engine"
          curl --fail --silent --show-error --retry 3 --retry-delay 1 --max-time 300 \
            --get --data-urlencode "domain=$engine" --data-urlencode "limit=8000" \
            "$AURORA_BACKEND/api/platform/components" -o domain-components.json
          jq -e --arg engine "$engine" '
            (.ok == true) and
            (.query.domain == $engine) and
            (.components | type == "array") and
            (all(.components[]?; (.domain_links | type == "array") and ((.domain_links | index($engine)) != null))) and
            (all(.components[]?; .execution_authority == false))
          ' domain-components.json

      - name: Verify every engine resource filter contract
        run: |
          set -euo pipefail
          test -s platform-capabilities.json
          jq -r '.engines[].id' platform-capabilities.json | while IFS= read -r engine; do
            test -n "$engine"
            echo "checking resource linkage for $engine"
            curl --fail --silent --show-error --retry 3 --retry-delay 1 \
              --get --data-urlencode "engine=$engine" \
              "$AURORA_BACKEND/api/platform/databases" -o engine-resources.json
            jq -e --arg engine "$engine" '
              (.ok == true) and
              (.engine == $engine) and
              (.count | type == "number") and
              (.assets | type == "array") and
              (all(.assets[]?; (.engine_links | type == "array") and ((.engine_links | index($engine)) != null))) and
              (.governance | type == "object")
            ' engine-resources.json
          done

      - name: Verify Result Vault contract
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            "$AURORA_BACKEND/api/vault/status" -o vault.json
          jq -e '
            (.ok == true) and
            ((.backend == "postgresql") or (.backend == "sqlite_fallback")) and
            (.schema_initialized_once == true)
          ' vault.json

      - name: Verify persisted execution APIs
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 \
            "$AURORA_BACKEND/api/dag/runs/recent" -o dag.json
          curl --fail --silent --show-error --retry 3 \
            "$AURORA_BACKEND/api/jobs/recent" -o jobs.json
          jq -e '(.ok == true) and (.runs | type == "array")' dag.json
          jq -e '(.ok == true) and (.jobs | type == "array")' jobs.json

      - name: Verify queued export API is installed
        run: |
          set -euo pipefail
          status=$(curl --silent --output export-queue.json --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"format":"pdf"}' \
            "$AURORA_BACKEND/api/exports/jobs")
          test "$status" = "400"
          jq -e '
            (.ok == false) and
            (.status == "export_queue_rejected") and
            (.error | type == "string")
          ' export-queue.json

  simulator-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build native iOS app
        run: |
          set -o pipefail
          xcodebuild -project AURORA.xcodeproj -scheme AURORA -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Package Simulator app
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            build/DerivedData/Build/Products/Debug-iphonesimulator/AURORA.app \
            artifacts/AURORA-Simulator.app.zip
      - name: Upload Simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: AURORA-iOS-Simulator
          path: artifacts/AURORA-Simulator.app.zip
          if-no-files-found: error
          retention-days: 14
