name: Process Execution Governance V3

on:
  pull_request:
    paths:
      - 'AURORA/ProcessExecutionGovernanceV3.swift'
      - 'AURORA/ScientificProjectBasisV3.swift'
      - 'AURORA/ExecutionGovernancePolicyV3.swift'
      - 'AURORA/ExecutionSubmodelScopeV3.swift'
      - 'AURORA/ExecutionGovernanceErrorBridge.swift'
      - 'AURORA/AURORAAPI.swift'
      - 'AURORA/CommandCenterView.swift'
      - 'AURORATests/Phase1DryGlauconiteAcceptanceTests.swift'
      - 'project.yml'
      - '.github/workflows/process-execution-governance-v3.yml'
  workflow_dispatch:

concurrency:
  group: aurora-process-execution-governance-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariant-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify graph, eligibility and submodel-scope invariants
        shell: bash
        run: |
          set -euo pipefail
          FILE=AURORA/ProcessExecutionGovernanceV3.swift
          POLICY=AURORA/ExecutionGovernancePolicyV3.swift
          SCOPE=AURORA/ExecutionSubmodelScopeV3.swift
          API=AURORA/AURORAAPI.swift
          test -s "$FILE"
          test -s "$POLICY"
          test -s "$SCOPE"
          grep -Fq 'AURORA-PROCESS-GRAPH-V3-2026.09.17' "$FILE"
          grep -Fq 'AURORA-ENGINE-ELIGIBILITY-V3-2026.09.17' "$FILE"
          grep -Fq 'fromNode' "$FILE"
          grep -Fq 'toNode' "$FILE"
          grep -Fq 'recycle' "$FILE"
          grep -Fq 'blockedEngines' "$FILE"
          grep -Fq 'eligibleEngines' "$FILE"
          grep -Fq 'explicit dry mode' "$FILE"
          grep -Fq 'graphless_raw_ore_diagnosis' "$POLICY"
          grep -Fq 'diagnosticGraphExemption' "$POLICY"
          grep -Fq 'ExecutionSubmodelScopeV3.enrich' "$POLICY"
          grep -Fq 'AURORA-SUBMODEL-SCOPE-V3-2026.09.17' "$SCOPE"
          grep -Fq '"classification": ["screening", "desliming", "hydrocyclone"]' "$SCOPE"
          grep -Fq 'strictResultScope' "$SCOPE"
          grep -Fq 'fail_closed_on_blocked_submodel_output' "$SCOPE"
          grep -Fq 'engine_family_only_no_submodel_claim' "$SCOPE"
          grep -Fq 'dryGlauconiteAcceptanceReceipt' "$FILE"
          grep -Fq 'dryGlauconiteAcceptanceProof' "$FILE"
          grep -Fq '"water_not_applicable"' "$FILE"
          grep -Fq '"classification_hydrocyclone_blocked"' "$FILE"
          grep -Fq 'Fe2O3 <= 3 wt%' "$FILE"
          grep -Fq 'ExecutionGovernancePolicyV3.finalize' "$API"
          grep -Fq 'ExecutionGovernancePolicyV3.directDispatchBlockReason' "$API"
          grep -Fq 'path == "/api/dag/runs"' "$API"
          echo 'Process Execution Governance V3 invariant guard: PASS'

  simulator-compile:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Compile native iOS application
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project AURORA.xcodeproj \
            -scheme AURORA \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build


  dry-glauconite-acceptance:
    name: Dry glauconite executable acceptance
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate

      - name: Select available iOS simulator
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); candidates=[d for runtime,devices in data.get("devices",{}).items() if "iOS" in runtime for d in devices if d.get("isAvailable") and str(d.get("name","")).startswith("iPhone")]; assert candidates, "No available iPhone simulator"; print(candidates[0]["udid"])')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          echo "Selected simulator: $DEVICE_ID"

      - name: Execute dry glauconite Phase 1 XCTest
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project AURORA.xcodeproj \
            -scheme AURORA-Phase1-Acceptance \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            test
          echo 'AURORA_PHASE1_DRY_GLAUCONITE_ACCEPTANCE_PASS'
