name: Canonical Mobile Runtime Contract
on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: aurora-canonical-mobile-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-runtime-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AURORA_BACKEND: https://todo-app-production-afcc.up.railway.app
    steps:
      - uses: actions/checkout@v4

      - name: Build canonical governed payload fixture
        run: |
          set -euo pipefail
          cat > payload.json <<'JSON'
          {
            "project": {
              "id": "77777777-2222-3333-4444-555555555555",
              "name": "CI Canonical Mobile Runtime",
              "oreType": "phosphate",
              "feedTph": 80.0
            },
            "designBasis": {
              "targetComponent": "P2O5",
              "targetGrade": 35.0,
              "authority": "user_declared_design_basis"
            },
            "analyses": [
              {
                "type": "XRF",
                "parameter": "P2O5",
                "value": 20.1,
                "unit": "%",
                "status": "MEASURED",
                "source": "CI-LAB-001",
                "sample": "FEED",
                "authority_requested": "measured",
                "authority_effective": "measured_source_tagged"
              },
              {
                "type": "XRF",
                "parameter": "SiO2",
                "value": 12.4,
                "unit": "%",
                "status": "DECLARED",
                "source": "mobile_quick_assay",
                "sample": "FEED",
                "authority_requested": "user_declared",
                "authority_effective": "user_declared"
              }
            ],
            "flowsheet": {
              "units": ["ROM Feed", "Scrubbing", "Desliming", "Flotation", "Product", "Tailings"],
              "authority": "user_declared_process_route",
              "topology_status": "design_intent_not_as_built"
            },
            "inputGovernance": {
              "runtime_projection": "canonical_analysis_array",
              "measured_rule": "measured_requires_nonempty_source_reference"
            }
          }
          JSON
          jq -e '.project.feedTph == 80 and (.analyses | type == "array") and (.flowsheet.units | length) >= 1' payload.json

      - name: Validate exact canonical payload
        run: |
          set -euo pipefail
          jq -n --slurpfile payload payload.json '{payload:$payload[0]}' > validate-request.json
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data-binary @validate-request.json \
            "$AURORA_BACKEND/api/validate" -o validate.json
          jq -e '.ok == true and .status == "input_valid" and .feed_tph == 80' validate.json

      - name: Submit same payload to canonical DAG
        run: |
          set -euo pipefail
          jq -n --slurpfile payload payload.json '{payload:$payload[0]}' > dag-request.json
          status=$(curl --silent --show-error --retry 3 --retry-delay 2 \
            --output dag-created.json \
            --write-out '%{http_code}' \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data-binary @dag-request.json \
            "$AURORA_BACKEND/api/dag/runs")
          test "$status" = "200" -o "$status" = "201" -o "$status" = "202"
          cat dag-created.json
          RUN_ID=$(jq -r '.run_id // .runId // .id // empty' dag-created.json)
          test -n "$RUN_ID"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Verify persisted DAG run and terminal execution state
        run: |
          set -euo pipefail
          terminal=0
          for attempt in $(seq 1 90); do
            status=$(curl --silent --show-error --retry 3 --retry-delay 1 \
              --output dag-run.json \
              --write-out '%{http_code}' \
              "$AURORA_BACKEND/api/dag/runs/$RUN_ID")
            test "$status" = "200"
            state=$(jq -r '(.status // .state // .run.status // "") | ascii_downcase' dag-run.json)
            echo "dag attempt=$attempt state=$state"
            case "$state" in
              completed|success|succeeded|failed|error|blocked|cancelled)
                terminal=1
                break
                ;;
            esac
            sleep 4
          done
          test "$terminal" = "1"
          jq -e 'type == "object"' dag-run.json

      - name: Verify DAG run appears in Result Vault listing
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 \
            "$AURORA_BACKEND/api/dag/runs/recent" -o recent.json
          jq -e --arg id "$RUN_ID" '
            (.ok == true) and
            (.runs | type == "array") and
            (any(.runs[]?; ((.run_id // .runId // .id // "") == $id)))
          ' recent.json

      - name: Resolve a registered execution engine
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 \
            "$AURORA_BACKEND/api/platform/capabilities" -o capabilities.json
          ENGINE_ID=$(jq -r '[.engines[]? | select(.id == "ore_intelligence") | .id][0] // .engines[0].id // empty' capabilities.json)
          test -n "$ENGINE_ID"
          echo "ENGINE_ID=$ENGINE_ID" >> "$GITHUB_ENV"
          echo "selected registered engine=$ENGINE_ID"

      - name: Submit canonical payload through selected-engine job path
        run: |
          set -euo pipefail
          jq --arg engine "$ENGINE_ID" \
            '. + {runMode:"module", requested_module:$engine, question:"Execute the selected governed AURORA engine and return evidence-bound outputs."}' \
            payload.json > module-payload.json
          jq -n --arg engine "$ENGINE_ID" --slurpfile payload module-payload.json \
            '{operation:"canonical_mobile_execute", requested_module:$engine, payload:$payload[0]}' > job-request.json

          # Mirrors AURORAAPI.run(): validate the wrapper, then create the job.
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data-binary @job-request.json \
            "$AURORA_BACKEND/api/validate" -o module-validate.json
          jq -e '.ok == true and .status == "input_valid"' module-validate.json

          status=$(curl --silent --show-error --retry 3 --retry-delay 2 \
            --output job-created.json \
            --write-out '%{http_code}' \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data-binary @job-request.json \
            "$AURORA_BACKEND/api/jobs")
          test "$status" = "200" -o "$status" = "201" -o "$status" = "202"
          cat job-created.json
          JOB_ID=$(jq -r '.job_id // .jobId // .id // empty' job-created.json)
          test -n "$JOB_ID"
          echo "JOB_ID=$JOB_ID" >> "$GITHUB_ENV"

      - name: Verify selected-engine job reaches a terminal persisted state
        run: |
          set -euo pipefail
          terminal=0
          for attempt in $(seq 1 90); do
            status=$(curl --silent --show-error --retry 3 --retry-delay 1 \
              --output engine-job.json \
              --write-out '%{http_code}' \
              "$AURORA_BACKEND/api/jobs/$JOB_ID?preview=1")
            test "$status" = "200"
            state=$(jq -r '(.status // .state // .platform_status // "") | ascii_downcase' engine-job.json)
            echo "engine attempt=$attempt state=$state"
            case "$state" in
              completed|success|succeeded|failed|error|blocked|cancelled)
                terminal=1
                break
                ;;
            esac
            sleep 4
          done
          test "$terminal" = "1"
          jq -e --arg engine "$ENGINE_ID" '
            (type == "object") and
            ((.requested_module // .requestedModule // .payload.requested_module // .payload.requestedModule // "") == $engine)
          ' engine-job.json

      - name: Verify selected-engine job appears in persisted job listing
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 \
            "$AURORA_BACKEND/api/jobs/recent" -o jobs-recent.json
          jq -e --arg id "$JOB_ID" '
            (.ok == true) and
            (.jobs | type == "array") and
            (any(.jobs[]?; ((.job_id // .jobId // .id // "") == $id)))
          ' jobs-recent.json
