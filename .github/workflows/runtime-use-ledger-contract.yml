name: Runtime Use Ledger Contract

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: aurora-runtime-use-ledger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-use-ledger-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AURORA_BACKEND: https://todo-app-production-afcc.up.railway.app
    steps:
      - uses: actions/checkout@v4

      - name: Verify native evidence-bound workspace
        shell: bash
        run: |
          set -euo pipefail
          test -f AURORA/RuntimeUseLedgerView.swift
          grep -Fq '/api/runtime/use-ledger' AURORA/RuntimeUseLedgerView.swift
          grep -Fq 'case useLedger = "Runtime Use Ledger"' AURORA/RootView.swift
          grep -Fq 'case .useLedger: RuntimeUseLedgerView()' AURORA/RootView.swift
          grep -Fq 'Section.useLedger,' AURORA/RootView.swift
          grep -Fq 'No semantic component or resource association is promoted to observed use.' AURORA/RuntimeUseLedgerView.swift
          grep -Fq 'The ledger intentionally stays empty when runtime proof is absent.' AURORA/RuntimeUseLedgerView.swift

      - name: Verify live ledger governance boundary
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --retry 4 --retry-delay 2 \
            --output ledger.json \
            --write-out '%{http_code}' \
            "$AURORA_BACKEND/api/runtime/use-ledger?limit=100")
          test "$status" = "200"
          jq -e '
            .ok == true and
            .revision == "AURORA-RUNTIME-USE-LEDGER-2026.09.13-1" and
            (.events | type == "array") and
            (.summary | type == "object") and
            .summary.component_use_count == 0 and
            .summary.resource_use_count == 0 and
            .governance.semantic_association_is_use_evidence == false and
            .governance.registered_engine_is_use_evidence == false and
            .governance.python_component_name_is_use_evidence == false and
            .governance.component_use_instrumentation == "not_installed" and
            .governance.resource_read_instrumentation == "not_installed" and
            .governance.call_graph_inference == "prohibited" and
            all(.events[]?; (.evidence_class == "observed_dispatch" or .evidence_class == "returned_payload_presence")) and
            all(.events[]?; (.target_type != "python_component" and .target_type != "scientific_asset"))
          ' ledger.json

      - name: Build governed ledger fixture and resolve execution engine
        shell: bash
        run: |
          set -euo pipefail
          cat > payload.json <<'JSON'
          {
            "project": {
              "id": "88888888-2222-3333-4444-555555555555",
              "name": "CI Runtime Use Ledger",
              "oreType": "phosphate",
              "feedTph": 80.0
            },
            "designBasis": {
              "targetComponent": "P2O5",
              "targetGrade": 35.0,
              "authority": "user_declared_design_basis"
            },
            "analyses": [
              {
                "type": "XRF",
                "parameter": "P2O5",
                "value": 20.1,
                "unit": "%",
                "status": "MEASURED",
                "source": "CI-LEDGER-LAB-001",
                "sample": "FEED",
                "authority_requested": "measured",
                "authority_effective": "measured_source_tagged"
              }
            ],
            "flowsheet": {
              "units": ["ROM Feed", "Scrubbing", "Desliming", "Flotation", "Product", "Tailings"],
              "authority": "user_declared_process_route",
              "topology_status": "design_intent_not_as_built"
            },
            "inputGovernance": {
              "runtime_projection": "canonical_analysis_array",
              "measured_rule": "measured_requires_nonempty_source_reference"
            }
          }
          JSON
          jq -e '.project.feedTph == 80 and (.analyses | type == "array")' payload.json

          curl --fail --silent --show-error --retry 4 \
            "$AURORA_BACKEND/api/platform/capabilities" -o capabilities.json
          ENGINE_ID=$(jq -r '[.engines[]? | select(.id == "ore_intelligence") | .id][0] // .engines[0].id // empty' capabilities.json)
          test -n "$ENGINE_ID"
          echo "ENGINE_ID=$ENGINE_ID" >> "$GITHUB_ENV"

      - name: Create and verify exact selected-engine dispatch evidence
        shell: bash
        run: |
          set -euo pipefail
          jq --arg engine "$ENGINE_ID" \
            '. + {runMode:"module", requested_module:$engine, question:"Execute the selected governed AURORA engine and return evidence-bound outputs."}' \
            payload.json > module-payload.json
          jq -n --arg engine "$ENGINE_ID" --slurpfile payload module-payload.json \
            '{operation:"canonical_mobile_execute", requested_module:$engine, payload:$payload[0]}' > job-request.json

          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data-binary @job-request.json \
            "$AURORA_BACKEND/api/validate" -o module-validate.json
          jq -e '.ok == true and .status == "input_valid"' module-validate.json

          status=$(curl --silent --show-error --retry 3 --retry-delay 2 \
            --output job-created.json \
            --write-out '%{http_code}' \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data-binary @job-request.json \
            "$AURORA_BACKEND/api/jobs")
          test "$status" = "200" -o "$status" = "201" -o "$status" = "202"
          JOB_ID=$(jq -r '.job_id // .jobId // .id // empty' job-created.json)
          test -n "$JOB_ID"

          terminal=0
          for attempt in $(seq 1 90); do
            curl --fail --silent --show-error --retry 3 \
              "$AURORA_BACKEND/api/jobs/$JOB_ID?preview=1" -o engine-job.json
            state=$(jq -r '(.status // .state // .platform_status // "") | ascii_downcase' engine-job.json)
            echo "engine attempt=$attempt state=$state"
            case "$state" in
              completed|success|succeeded|failed|error|blocked|cancelled)
                terminal=1
                break
                ;;
            esac
            sleep 4
          done
          test "$terminal" = "1"

          curl --fail --silent --show-error --retry 4 \
            "$AURORA_BACKEND/api/runtime/use-ledger?job_id=$JOB_ID" -o job-ledger.json
          jq -e --arg job "$JOB_ID" --arg engine "$ENGINE_ID" '
            .ok == true and
            (.events | type == "array") and
            (any(.events[]?; .run_id == $job and .target_type == "canonical_runtime" and .evidence_class == "observed_dispatch" and .proof_type == "job_entered_canonical_executor")) and
            (any(.events[]?; .run_id == $job and .target_type == "registered_engine" and .engine_id == $engine and .evidence_class == "observed_dispatch" and .proof_type == "explicit_requested_module_dispatch")) and
            all(.events[]?; .target_type != "python_component" and .target_type != "scientific_asset")
          ' job-ledger.json

      - name: Create and verify exact DAG fan-out evidence without per-engine dispatch inference
        shell: bash
        run: |
          set -euo pipefail
          jq -n --slurpfile payload payload.json '{payload:$payload[0]}' > dag-request.json
          status=$(curl --silent --show-error --retry 3 --retry-delay 2 \
            --output dag-created.json \
            --write-out '%{http_code}' \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data-binary @dag-request.json \
            "$AURORA_BACKEND/api/dag/runs")
          test "$status" = "200" -o "$status" = "201" -o "$status" = "202"
          RUN_ID=$(jq -r '.run_id // .runId // .id // empty' dag-created.json)
          test -n "$RUN_ID"

          terminal=0
          for attempt in $(seq 1 90); do
            curl --fail --silent --show-error --retry 3 \
              "$AURORA_BACKEND/api/dag/runs/$RUN_ID" -o dag-run.json
            state=$(jq -r '(.status // .state // .run.status // "") | ascii_downcase' dag-run.json)
            echo "dag attempt=$attempt state=$state"
            case "$state" in
              completed|success|succeeded|failed|error|blocked|cancelled)
                terminal=1
                break
                ;;
            esac
            sleep 4
          done
          test "$terminal" = "1"

          curl --fail --silent --show-error --retry 4 \
            "$AURORA_BACKEND/api/runtime/use-ledger?run_id=$RUN_ID" -o dag-ledger.json
          jq -e --arg run "$RUN_ID" '
            .ok == true and
            (.events | type == "array") and
            (any(.events[]?; .run_id == $run and .target_type == "canonical_runtime" and .evidence_class == "observed_dispatch" and .proof_type == "dag_engine_fanout_entered_canonical_executor")) and
            all(.events[]?; (.target_type != "registered_engine" or .evidence_class != "observed_dispatch")) and
            all(.events[]?; .target_type != "python_component" and .target_type != "scientific_asset") and
            .summary.component_use_count == 0 and
            .summary.resource_use_count == 0
          ' dag-ledger.json
